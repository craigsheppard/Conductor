# SwiftLint config for Conductor.
# Strict by default. The harness treats lint warnings as build failures
# (see scripts/blt-cp). Add disables only with a comment explaining why.

included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - DerivedData

# Errors block CI. Warnings also block CI (zero-warning policy — see GRADING_CRITERIA.md).
analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - anyobject_protocol
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

disabled_rules:
  # `missing_docs` lights up across our growing codebase; we re-enable it per-file
  # via header comments once we have real public API. Keep it opt-in for now.
  - missing_docs
  # `file_header` is opt-in but we don't enforce a fixed header yet.
  - file_header

# Hard limits — violations are errors, not warnings.
line_length:
  warning: 120
  error: 120
  ignores_comments: false
  ignores_urls: true

cyclomatic_complexity:
  warning: 10
  error: 10

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 600

force_cast: error
force_try: error
force_unwrapping:
  severity: error

reporter: "github-actions-logging"
